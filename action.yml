# BOF 
name: 'GitHub Action Release Version'
author: davekpatrick
description: 'A GitHub Action to create and tag a release version'
## ------------------------------
inputs:
  apiToken:
   description: 'GitHub API token'
   required: false
  tagPrefix:
    description: 'Release tag prefix character(s) to use'
    required: false
    default: 'v'
  inceptionVersionTag: 
    description: 'The initial version tag to use for the first release'
    required: false
    default: '0.0.0'
  version: 
    description: 'The semver version to use as the current version'
    required: false
  versionInputAsReleaseVersion:
    description: 'Use the current version input as the release version (true|false)'
    required: false
    default: 'false'
  keywords:
    description: 'A comma-separated list of keywords to identify the type of release'
    required: false
    default: 'major,minor,patch,premajor,preminor,prepatch,prerelease'
## ------------------------------
outputs:
  versionTag: # id of output
    description: 'The release version tag'
## ------------------------------
branding:
    icon: 'check-circle'
    color: 'green'
## ------------------------------
runs:
  using: 'node20'
  main: 'node/dist/index.js'
# EOF
